name: RedBus Automation CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run Automated Pytest Suite & Health Checks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Environment Health
        run: |
          bash scripts/health_check.sh

      - name: Execute Automated Test Suite
        run: |
          python -m pytest tests/ -v --tb=short

      - name: Verify CLI Execution
        run: |
          python -m redbus_automation.main --source Bangalore --destination Hyderabad
